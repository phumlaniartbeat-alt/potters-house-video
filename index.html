<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>The Potter's House Haddon</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

.video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 177.78vh;
  height: 100vh;
  min-width: 100%;
  min-height: 56.25vw;
  transform: translate(-50%, -50%);
  border: 0;
}

.dark {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.42);
  pointer-events: none;
}

.content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 30px;
  font-family: Arial, Helvetica, sans-serif;
  pointer-events: none;
}

.title {
  font-size: clamp(32px, 5vw, 72px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 2px;
  text-transform: uppercase;
  max-width: 1100px;
}

.subtitle {
  margin-top: 28px;
  font-size: clamp(17px, 2vw, 25px);
  line-height: 1.5;
}

@media (max-width: 600px) {
  .hero {
    height: 100vh;
  }

  .title {
    font-size: 34px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 17px;
    margin-top: 22px;
  }
}
</style>
</head>

<body>

<div class="hero">

  <iframe
    class="video"
    src="https://www.youtube.com/embed/FumtjvgNYP8?autoplay=1&mute=1&loop=1&playlist=FumtjvgNYP8&controls=0&rel=0&playsinline=1"
    title="The Potter's House Haddon"
    allow="autoplay; encrypted-media; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    frameborder="0">
  </iframe>

  <div class="dark"></div>

  <div class="content">
    <div class="title">
      Changing Lives<br>
      Making Disciples<br>
      Reaching The World
    </div>

    <div class="subtitle">
      Come join us Sundays at 10AM &amp; 5PM<br>
      Wednesdays at 7PM
    </div>
  </div>

</div>

</body>
</html>
